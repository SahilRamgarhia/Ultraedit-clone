<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD DESIGN</title>
    <style>
        body {
            background-color: gray;
            padding-left: 525px;
            padding-top: 20px;
        }

        .box {
            background-color: rgb(253, 253, 253);
            border-radius: 7px;
            height: 600px;
            width: 300px
        ; 
        }
        *{
            margin: 0px;
            padding: 0px;
        }

        .image {
            padding: 10px;
        }

        .image img {
            border-radius: 7px;
        }
        .capsules{
            padding: 2px 10px;
        }
        .capsules span{
            padding: 2px 10px;
            border: 2px solid gray;
            border-radius:14px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-style: bold;
            font-size: 13px;
        }
        .content{
            padding: 20px 13px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 7px 14px;
            border-radius: 12px;
            background-color: rgb(207, 207, 252);
            color: rgb(12, 138, 255);
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        .button button:hover{
            background-color: rgb(153, 153, 250);
            color: rgb(12, 138, 255);
        }
        .capsules{
            color: gray;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="image">
            <img width="280"
                src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?q=80&w=1528&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D "
                alt="car">
        </div>
        <div class="capsules">
            
           <span>BMW</span> 
             <SPAN>M5</SPAN> 
             
        </div>
        <div class="content">
            <h2>SAHIL</h2>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dicta laborum nemo aperiam ipsa consequatur
            nostrum, cum consectetur quaerat, est iste, veritatis amet molestias voluptates , eveniet.</p>
</div>
<div class="button">
   <button><h4>Read More</h4></button> 
</div>
        
    </div>
</body>

</html>
